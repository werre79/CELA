name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        # npm ci installs exactly what package-lock.json pins — reproducible builds.
        # (The old "rm package-lock.json" workaround is no longer needed:
        # the lockfile is verified to be in sync with package.json.)
        run: npm ci

      - name: Build
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Create SPA fallback (404.html)
        # GitHub Pages has no rewrite rules; serving index.html on 404 lets
        # deep links like /project/<slug> and /publications survive a refresh
        # or a direct visit. The Angular router then resolves the real route.
        run: cp dist/cepa-website/index.html dist/cepa-website/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/cepa-website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4